<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Kata Laluan - ABR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Set Semula Kata Laluan</h2>
            <p>Masukkan alamat e-mel anda. Kami akan menghantar pautan untuk set semula kata laluan anda.</p>
            <form id="forgot-password-form">
                <input type="email" id="forgot-email" placeholder="Email Anda" required>
                <button type="submit">Hantar Pautan Set Semula</button>
            </form>
            <div id="message-container" style="margin-top: 15px;"></div>
            <p style="margin-top: 20px;"><a href="index.html">Kembali ke Log Masuk</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const messageContainer = document.getElementById('message-container');

        forgotPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('forgot-email').value;
            
            // Use the production URL for the redirect
            const redirectTo = 'https://sistemubbl.abrbrillante.com/reset-password.html';

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: redirectTo,
            });

            if (error) {
                messageContainer.innerHTML = `<p class="error">Ralat: ${error.message}</p>`;
            } else {
                messageContainer.innerHTML = '<p class="success">Pautan set semula kata laluan telah dihantar ke e-mel anda. Sila periksa peti masuk anda.</p>';
                forgotPasswordForm.reset();
            }
        });
    </script>
</body>
</html>
