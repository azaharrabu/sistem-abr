<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Semula Kata Laluan - Sistem Rujukan UBBL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="images/abr-logo2.jpg" alt="Logo" class="logo">
        </div>
        <div id="auth-section">
            <h2>Set Semula Kata Laluan</h2>
            <p>Masukkan alamat e-mel anda. Kami akan menghantar pautan untuk set semula kata laluan anda.</p>
            <form id="forgot-password-form">
                <input type="email" id="email" placeholder="Email Anda" required>
                <button type="submit">Hantar Pautan Set Semula</button>
            </form>
            <p id="message"></p>
            <div class="links">
                <a href="index.html">Kembali ke Log Masuk</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SUPABASE_URL = "https://grpyjfftucaooghlutgb.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdycHlqZmZ0dWNhb29naGx1dGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5Mjk5MjcsImV4cCI6MjA3ODUwNTkyN30.4hABCHnnUFSqTX0vRhWddEEPmzPnMrXg0Bweu30P1GY";

            // Pastikan supabase-js dimuatkan
            if (!window.supabase) {
                console.error('Supabase JS library not loaded.');
                document.getElementById('message').textContent = 'Ralat kritikal: Pustaka Supabase gagal dimuatkan.';
                return;
            }

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const form = document.getElementById('forgot-password-form');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    console.log('Forgot password form submitted.');

                    const email = document.getElementById('email').value;
                    const messageEl = document.getElementById('message');
                    const button = e.target.querySelector('button');

                    button.disabled = true;
                    button.textContent = 'Menghantar...';
                    messageEl.textContent = '';
                    messageEl.classList.remove('error', 'success');

                    try {
                        console.log(`Sending password reset for email: ${email}`);
                        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
                            redirectTo: window.location.origin + '/reset-password.html',
                        });

                        if (error) {
                            console.error('Supabase password reset error:', error.message);
                            messageEl.textContent = `Ralat: ${error.message}`;
                            messageEl.classList.add('error');
                        } else {
                            messageEl.textContent = 'Jika akaun dengan e-mel ini wujud, pautan set semula kata laluan telah dihantar.';
                            messageEl.classList.add('success');
                            form.reset();
                        }
                    } catch (err) {
                        console.error('Generic error in forgot-password:', err.message);
                        messageEl.textContent = `Gagal menghubungi pelayan. Ralat: ${err.message}`;
                        messageEl.classList.add('error');
                    } finally {
                        button.disabled = false;
                        button.textContent = 'Hantar Pautan Set Semula';
                        console.log('Process finished.');
                    }
                });
            }
        });
    </script>
</body>
</html>
