<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Semula Kata Laluan - ABR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Set Semula Kata Laluan Anda</h2>
            <p>Sila masukkan kata laluan baru anda di bawah.</p>
            <form id="update-password-form">
                <input type="password" id="new-password" placeholder="Kata Laluan Baru" required>
                <input type="password" id="confirm-password" placeholder="Sahkan Kata Laluan Baru" required>
                <button type="submit">Kemas Kini Kata Laluan</button>
            </form>
            <div id="message" style="margin-top: 15px;"></div>
            <p style="margin-top: 20px; display: none;" id="login-link-container">
                <a href="index.html">Teruskan ke Halaman Log Masuk</a>
            </p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const updateForm = document.getElementById('update-password-form');
        const messageDiv = document.getElementById('message');
        const loginLinkContainer = document.getElementById('login-link-container');
        let accessToken = null;

        // Listen for the event when the user is signed in (after password recovery)
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                // The user has been redirected from the password recovery email.
                // The session object contains the access token needed to update the password.
                if (session && session.access_token) {
                    accessToken = session.access_token;
                }
            }
        });

        updateForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            messageDiv.textContent = '';
            messageDiv.style.color = 'black';

            if (newPassword !== confirmPassword) {
                messageDiv.textContent = 'Kata laluan tidak sepadan. Sila cuba lagi.';
                messageDiv.style.color = 'red';
                return;
            }

            if (newPassword.length < 6) {
                messageDiv.textContent = 'Kata laluan mesti sekurang-kurangnya 6 aksara.';
                messageDiv.style.color = 'red';
                return;
            }

            if (!accessToken) {
                messageDiv.textContent = 'Token set semula tidak sah atau telah tamat tempoh. Sila minta pautan baru.';
                messageDiv.style.color = 'red';
                return;
            }

            updateForm.querySelector('button').disabled = true;
            updateForm.querySelector('button').textContent = 'Mengemas kini...';

            const { error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                console.error('Password update error:', error.message);
                messageDiv.textContent = 'Gagal mengemas kini kata laluan. Sila cuba minta pautan baru.';
                messageDiv.style.color = 'red';
                updateForm.querySelector('button').disabled = false;
                updateForm.querySelector('button').textContent = 'Kemas Kini Kata Laluan';
            } else {
                messageDiv.textContent = 'Kata laluan anda telah berjaya dikemas kini.';
                messageDiv.style.color = 'green';
                // Hide the form and show the login link
                updateForm.style.display = 'none';
                loginLinkContainer.style.display = 'block';
            }
        });
    </script>
</body>
</html>
