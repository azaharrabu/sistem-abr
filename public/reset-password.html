<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Semula Kata Laluan Baharu - Sistem Rujukan UBBL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="abr-logo2.jpg" alt="Logo" class="logo">
        </div>
        <div id="auth-section">
            <h2>Cipta Kata Laluan Baharu</h2>
            <p>Masukkan kata laluan baharu anda di bawah.</p>
            <form id="reset-password-form">
                <input type="password" id="password" placeholder="Kata Laluan Baharu" required>
                <input type="password" id="confirm-password" placeholder="Sahkan Kata Laluan Baharu" required>
                <button type="submit">Simpan Kata Laluan Baharu</button>
            </form>
            <p id="message"></p>
            <div class="links">
                <a href="index.html" id="login-link" style="display: none;">Pergi ke Log Masuk</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SUPABASE_URL = "https://grpyjfftucaooghlutgb.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdycHlqZmZ0dWNhb29naGx1dGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI5Mjk5MjcsImV4cCI6MjA3ODUwNTkyN30.4hABCHnnUFSqTX0vRhWddEEPmzPnMrXg0Bweu30P1GY";

            if (!window.supabase) {
                console.error('Supabase JS library not loaded.');
                document.getElementById('message').textContent = 'Ralat kritikal: Pustaka Supabase gagal dimuatkan.';
                return;
            }

            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            const messageEl = document.getElementById('message');
            const form = document.getElementById('reset-password-form');
            const loginLink = document.getElementById('login-link');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const button = form.querySelector('button');

                messageEl.textContent = '';
                messageEl.classList.remove('error', 'success');

                if (password.length < 6) {
                    messageEl.textContent = 'Kata laluan mesti sekurang-kurangnya 6 aksara.';
                    messageEl.classList.add('error');
                    return;
                }

                if (password !== confirmPassword) {
                    messageEl.textContent = 'Kata laluan tidak sepadan.';
                    messageEl.classList.add('error');
                    return;
                }

                button.disabled = true;
                button.textContent = 'Menyimpan...';

                try {
                    // Supabase akan mengendalikan token secara automatik dari URL
                    // apabila pengguna tiba di halaman ini dari pautan e-mel.
                    const { data, error } = await supabase.auth.updateUser({ password: password });

                    if (error) {
                        throw error;
                    }

                    messageEl.textContent = 'Kata laluan anda telah berjaya dikemas kini!';
                    messageEl.classList.add('success');
                    form.style.display = 'none'; // Sembunyikan borang selepas berjaya
                    loginLink.style.display = 'block'; // Tunjukkan pautan log masuk

                } catch (error) {
                    console.error('Error updating password:', error.message);
                    messageEl.textContent = `Gagal mengemas kini kata laluan: ${error.message}`;
                    messageEl.classList.add('error');
                    button.disabled = false;
                    button.textContent = 'Simpan Kata Laluan Baharu';
                }
            });

            // Semak sama ada terdapat serpihan hash ralat dalam URL semasa mendarat
            // Cth: ...#error=unauthorized_client&error_code=401&error_description=Email+link+is+invalid+or+has+expired
            if (window.location.hash && window.location.hash.includes('error')) {
                const params = new URLSearchParams(window.location.hash.substring(1)); // Buang '#'
                const errorDescription = params.get('error_description') || 'Pautan tidak sah atau telah tamat tempoh.';
                messageEl.textContent = `Ralat: ${errorDescription.replace(/\+/g, ' ')}`;
                messageEl.classList.add('error');
                form.style.display = 'none'; // Sembunyikan borang jika ada ralat
            }
        });
    </script>
</body>
</html>
