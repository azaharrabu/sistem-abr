<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Semula Kata Laluan - ABR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2>Cipta Kata Laluan Baharu</h2>
            <p>Masukkan kata laluan baharu anda di bawah.</p>
            <form id="reset-password-form">
                <input type="password" id="new-password" placeholder="Kata Laluan Baharu" required>
                <button type="submit">Simpan Kata Laluan Baharu</button>
            </form>
            <div id="message-container" style="margin-top: 15px;"></div>
             <p style="margin-top: 20px;"><a href="index.html">Pergi ke Log Masuk</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const supabase = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
        const resetPasswordForm = document.getElementById('reset-password-form');
        const messageContainer = document.getElementById('message-container');

        resetPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const newPassword = document.getElementById('new-password').value;

            const { error } = await supabase.auth.updateUser({ password: newPassword });

            if (error) {
                messageContainer.innerHTML = `<p class="error">Ralat: ${error.message}</p>`;
            } else {
                messageContainer.innerHTML = '<p class="success">Kata laluan anda telah berjaya dikemas kini. Anda kini boleh log masuk dengan kata laluan baharu.</p>';
                resetPasswordForm.reset();
            }
        });
    </script>
</body>
</html>
