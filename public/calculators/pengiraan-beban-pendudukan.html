<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Jalan Keluar UBBL 1984</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Tukar kepada align-items-start */
            margin: 0;
            padding: 2em 0; /* Tambah padding atas dan bawah */
        }
        .container {
            background-color: #fff;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
        }
        .input-group {
            margin-bottom: 1.5em;
            text-align: left;
        }
        label, select, input {
            display: block;
            width: 100%;
            padding: 0.8em;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 0.5em;
        }
        .buttons {
            margin-top: 1.5em;
        }
        button {
            width: 100%;
            padding: 1em;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            background-color: #f44336; /* Merah */
            color: white;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #d32f2f;
        }
        #result {
            margin-top: 2em;
            padding: 1em;
            background-color: #e9e9e9;
            border-radius: 4px;
            font-size: 1em;
            color: #333;
            text-align: left;
        }
        .result-item {
            padding: 5px 0;
        }
        .population-label {
             font-weight: bold;
             color: #555;
             border-bottom: 1px dashed #ccc;
             padding-bottom: 10px;
             margin-bottom: 10px;
        }
        .message-error {
            color: #d32f2f; /* Darker red for better readability */
            font-weight: bold;
        }
        .message-success {
            color: #388e3c; /* Green */
        }
        .message-warning {
            color: #f57c00; /* Orange */
            font-weight: bold;
        }
        #institusional-sub-group {
            display: none; /* Sembunyi secara lalai */
            margin-top: -1em; /* Kurangkan ruang jika tersembunyi */
        }
        #kediaman-lain-sub-group {
            display: none; /* Sembunyi secara lalai */
            margin-top: -1em;
        }
        #kedai-sub-group {
            display: none; /* Sembunyi secara lalai */
            margin-top: -1em;
        }
        #perhimpunan-sub-group {
            display: none; /* Sembunyi secara lalai */
            margin-top: -1em;
        }
        #storan-am-sub-group {
            display: none; /* Sembunyi secara lalai */
            margin-top: -1em;
        }
        .logo-img {
            max-width: 150px; /* Laraskan saiz mengikut keperluan */
            height: auto; /* Mengekalkan nisbah aspek */
            margin-bottom: 1em;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="../images/abr-logo2.jpg" alt="Logo Syarikat" class="logo-img">
    <h1>Kalkulator Jalan Keluar UBBL 1984</h1>
    <p>Pengiraan Keperluan Jalan Keluar Mengikut Jadual 5, 7 & UUK 168 & 176</p>
    
    <div class="input-group">
        <label for="kategoriBangunan">Pilih Kategori Bangunan:</label>
        <select id="kategoriBangunan">
            <option value="">-- Sila Pilih --</option>
            <option value="kediaman-kecil">I - Kediaman Kecil</option>
            <option value="institusional">II - Institusional</option>
            <option value="kediaman-lain">III - Kediaman Lain (cth: Hotel)</option>
            <option value="pejabat">IV - Pejabat</option>
            <option value="kedai">V - Kedai</option>
            <option value="kilang">VI - Kilang</option>
            <option value="tempat-perhimpunan">VII - Tempat Perhimpunan</option>
            <option value="storan-am">VIII - Storan dan Am</option>
        </select>
    </div>

    <div class="input-group" id="institusional-sub-group">
        <label for="institusionalSubKategori">Pilih Sub-Kategori Institusional:</label>
        <select id="institusionalSubKategori">
            <option value="">-- Sila Pilih --</option>
            <option value="bilik-darjah">Bilik Darjah (2.0 m² bersih)</option>
            <option value="bengkel-vokasional">Bengkel/Vokasional (4.5 m² bersih)</option>
            <option value="makmal">Makmal (4.5 m² bersih)</option>
            <option value="penginapan-pesakit">Penginapan Pesakit (24.0 m² kasar)</option>
        </select>
    </div>

    <div class="input-group" id="kediaman-lain-sub-group">
        <label for="kediamanLainSubKategori">Pilih Sub-Kategori Kediaman Lain:</label>
        <select id="kediamanLainSubKategori">
            <option value="">-- Sila Pilih --</option>
            <option value="kediaman-lain-umum">Kediaman Lain (Umum) (20.0 m² kasar)</option>
            <option value="kawasan-awam-hotel">Kawasan Awam Hotel (20.0 m² kasar)</option>
            <option value="pangsapuri">Pangsapuri/Rumah Pangsa (24.0 m² kasar)</option>
        </select>
    </div>

    <div class="input-group" id="kedai-sub-group">
        <label for="kedaiSubKategori">Pilih Sub-Kategori Kedai:</label>
        <select id="kedaiSubKategori">
            <option value="">-- Sila Pilih --</option>
            <option value="kedai-bawah">Lantai Paras Jalan/Bawah Tanah (3.0 m² kasar)</option>
            <option value="kedai-lain">Lantai-lantai Lain (6.0 m² kasar)</option>
            <option value="kedai-storan">Kawasan Penstoran/Perkapalan (10.0 m² kasar)</option>
        </select>
    </div>

    <div class="input-group" id="perhimpunan-sub-group">
        <label for="perhimpunanSubKategori">Pilih Sub-Kategori Tempat Perhimpunan:</label>
        <select id="perhimpunanSubKategori">
            <option value="">-- Sila Pilih --</option>
            <option value="perhimpunan-umum">Tempat Perhimpunan (Umum) (1.5 m² bersih)</option>
            <option value="perhimpunan-tertumpu">Kegunaan Tertumpu (tanpa tempat duduk tetap) (0.7 m² bersih)</option>
            <option value="perhimpunan-berdiri">Kawasan Berdiri (0.3 m² bersih)</option>
        </select>
    </div>

    <div class="input-group" id="storan-am-sub-group">
        <label for="storanAmSubKategori">Pilih Sub-Kategori Storan dan Am:</label>
        <select id="storanAmSubKategori">
            <option value="">-- Sila Pilih --</option>
            <option value="tempat-letak-kereta">Tempat Letak Kereta (20.0 m² kasar)</option>
            <option value="gudang">Gudang (30.0 m² kasar)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="luasLantai">Masukkan Luas Lantai Kasar (meter persegi):</label>
        <input type="number" id="luasLantai" name="luasLantai" min="1" placeholder="Cth: 500" required>
    </div>

    <div class="input-group">
        <label for="jarakPerjalanan">Jarak Perjalanan Maksimum (Jalan Keluar Tunggal) [meter]:</label>
        <input type="number" id="jarakPerjalanan" name="jarakPerjalanan" min="0" placeholder="Cth: 15 (Untuk laluan mati)" required>
    </div>
    
    <div class="buttons">
        <button id="btnKira">Kira Semua Keperluan Jalan Keluar</button>
    </div>
    
    <div id="result">
        </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const kategoriBangunanSelect = document.getElementById('kategoriBangunan');
        const luasLantaiInput = document.getElementById('luasLantai');
        const jarakPerjalananInput = document.getElementById('jarakPerjalanan');
        const btnKira = document.getElementById('btnKira');
        const resultDiv = document.getElementById('result');

        // Jadual Ketujuh UBBL: Faktor Beban Pendudukan (m² / orang)
        const faktorBebanPendudukan = {
            "kediaman-kecil": 0,      // Tidak dikira
            "kediaman-lain-umum": 20.0,
            "pejabat": 10.0,
            "kilang": 10.0,
            "storan-am": 28.0,
            "bilik-darjah": 2.0,
            "bengkel-vokasional": 4.5,
            "makmal": 4.5,
            "penginapan-pesakit": 24.0,
            "kawasan-awam-hotel": 20.0,
            "pangsapuri": 24.0,
            "kedai-bawah": 3.0,
            "kedai-lain": 6.0,
            "kedai-storan": 10.0,
            "perhimpunan-umum": 1.5,
            "perhimpunan-tertumpu": 0.7,
            "perhimpunan-berdiri": 0.3,
            "tempat-letak-kereta": 20.0,
            "gudang": 30.0,
        };

        // UBBL Konstanta berdasarkan contoh pengiraan manual
        const MAKS_BEBAN_1_EXIT = 50;
        const MAKS_JARAK_1_EXIT_PEJABAT = 15;
        const LEBAR_SATU_UNIT = 550; // dalam mm
        const KAPASITI_PINTU_PER_UNIT = 100;
        const KAPASITI_TANGGA_PER_UNIT = 60;
        const FAKTOR_TANGGA_F = 4; // Faktor F untuk bangunan Kelas B

        function kiraBilanganOrang(luasLantai, kategori) {
            const faktor = faktorBebanPendudukan[kategori];
            if (kategori === "kediaman-kecil") return "N/A";
            if (faktor === undefined || faktor === 0) return 0;
            return Math.ceil(luasLantai / faktor);
        }

        kategoriBangunanSelect.addEventListener('change', () => {
            const val = kategoriBangunanSelect.value;
            document.querySelectorAll('.input-group[id$="-sub-group"]').forEach(el => el.style.display = 'none');
            const subGroupToShow = document.getElementById(`${val}-sub-group`);
            if (subGroupToShow) subGroupToShow.style.display = 'block';
        });

        btnKira.addEventListener('click', () => {
            let kategori = kategoriBangunanSelect.value;
            const luasLantai = parseFloat(luasLantaiInput.value);
            const jarakPerjalanan = parseFloat(jarakPerjalananInput.value);
            const kategoriUtama = kategori;

            const subCategoryMap = {
                'institusional': 'institusionalSubKategori',
                'kediaman-lain': 'kediamanLainSubKategori',
                'kedai': 'kedaiSubKategori',
                'tempat-perhimpunan': 'perhimpunanSubKategori',
                'storan-am': 'storanAmSubKategori'
            };

            if (subCategoryMap[kategori]) {
                const subKategori = document.getElementById(subCategoryMap[kategori]).value;
                if (!subKategori) {
                     resultDiv.innerHTML = `<div class="message-error">⚠️ Sila pilih sub-kategori untuk ${kategori.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())}.</div>`;
                     return;
                }
                kategori = subKategori;
            }

            if (kategori === "" || isNaN(luasLantai) || luasLantai <= 0 || isNaN(jarakPerjalanan) || jarakPerjalanan < 0) {
                resultDiv.innerHTML = '<div class="message-error">⚠️ Sila lengkapkan semua medan dengan nilai yang sah.</div>';
                return;
            }

            const bilanganOrang = kiraBilanganOrang(luasLantai, kategori);

            if (bilanganOrang === "N/A") {
                resultDiv.innerHTML = `<div class="message-success">Untuk kategori 'Kediaman Kecil', pengiraan beban pendudukan tidak diperlukan mengikut UBBL 1984.</div>`;
                return;
            }

            // --- PENGIRAAN PINTU KELUAR ---
            const unitLebarPintu = Math.ceil(bilanganOrang / KAPASITI_PINTU_PER_UNIT);
            const jumlahLebarPintu = unitLebarPintu * LEBAR_SATU_UNIT;

            // --- PENGIRAAN TANGGA ---
            const unitLebarTangga = Math.max(1, Math.ceil(bilanganOrang / KAPASITI_TANGGA_PER_UNIT)); // Pastikan minimum 1 unit
            const jumlahLebarTangga = unitLebarTangga * LEBAR_SATU_UNIT;
            
            // Formula Bilangan Tangga: (U/F) + 1
            const U_tangga = unitLebarTangga;
            let jumlahTanggaMinimum = Math.ceil((U_tangga / FAKTOR_TANGGA_F)) + 1;

            // Semak terhadap keperluan minimum UUK 168 (Beban & Jarak)
             if (bilanganOrang > MAKS_BEBAN_1_EXIT && jumlahTanggaMinimum < 2) {
                jumlahTanggaMinimum = 2; 
            } else if (bilanganOrang <= MAKS_BEBAN_1_EXIT && (kategoriUtama === "pejabat" || kategoriUtama === "kedai" || kategoriUtama === "kilang") && jarakPerjalanan > MAKS_JARAK_1_EXIT_PEJABAT && jumlahTanggaMinimum < 2) {
                jumlahTanggaMinimum = 2; 
            }

            // --- Agihan Lebar (UUK 177a) ---
            const bakiJalanKeluar = jumlahTanggaMinimum > 1 ? jumlahTanggaMinimum - 1 : 1;
            const lebarSatuTangga = Math.ceil(jumlahLebarTangga / bakiJalanKeluar);
            const lebarSatuPintu = Math.ceil(jumlahLebarPintu / bakiJalanKeluar);
            

            resultDiv.innerHTML = `
                <div class="result-item" style="text-align:center;">
                    <div class="population-label">Anggaran Beban Pendudukan: <strong>${bilanganOrang} orang</strong></div>
                </div>
                
                <hr style="margin: 1.5em 0;">

                <div class="result-item"><strong>1. KEPERLUAN PINTU KELUAR:</strong></div>
                <div class="result-item" style="padding-left: 1em;">&bull; Unit Lebar Diperlukan: ${bilanganOrang} orang / ${KAPASITI_PINTU_PER_UNIT} = ${ (bilanganOrang / KAPASITI_PINTU_PER_UNIT).toFixed(2) } ➜ <strong>${unitLebarPintu} unit</strong></div>
                <div class="result-item" style="padding-left: 1em;">&bull; Jumlah Lebar Pintu: ${unitLebarPintu} unit &times; ${LEBAR_SATU_UNIT}mm = <strong>${jumlahLebarPintu.toLocaleString()} mm</strong> (${(jumlahLebarPintu/1000).toFixed(2)} m)</div>
                
                <hr style="margin: 1.5em 0;">
                
                <div class="result-item"><strong>2. KEPERLUAN TANGGA:</strong></div>
                <div class="result-item" style="padding-left: 1em;">&bull; Unit Lebar Diperlukan (U): ${bilanganOrang} orang / ${KAPASITI_TANGGA_PER_UNIT} = ${(bilanganOrang / KAPASITI_TANGGA_PER_UNIT).toFixed(2)} ➜ <strong>${unitLebarTangga} unit</strong></div>
                <div class="result-item" style="padding-left: 1em;">&bull; Jumlah Lebar Tangga: ${unitLebarTangga} unit &times; ${LEBAR_SATU_UNIT}mm = <strong>${jumlahLebarTangga.toLocaleString()} mm</strong> (${(jumlahLebarTangga/1000).toFixed(2)} m)</div>
                <br>
                <div class="result-item" style="padding-left: 1em;">&bull; Anggaran Jumlah Tangga: (U/F) + 1 = (${unitLebarTangga}/${FAKTOR_TANGGA_F}) + 1 = ${(unitLebarTangga/FAKTOR_TANGGA_F + 1).toFixed(2)} ➜ <strong>${jumlahTanggaMinimum} buah tangga</strong></div>
                <div class="result-item" style="font-size: 0.8em; color: #666; padding-left: 2em;">*Disemak juga terhadap had beban & jarak UUK 168.</div>
                
                <hr style="margin: 1.5em 0;">

                <div class="result-item"><strong>3. AGIHAN LEBAR MENGIKUT UUK 177(a):</strong></div>
                <div class="result-item" style="padding-left: 1em;">Dengan andaian satu laluan keluar gagal, lebar diagihkan kepada baki <strong>${bakiJalanKeluar}</strong> laluan.</div>
                <div class="result-item" style="padding-left: 1em; font-size: 1.1em; color: #d32f2f;">
                    &bull; Kelebaran Minima Setiap Pintu Keluar: <strong>${lebarSatuPintu.toLocaleString()} mm</strong> (${(lebarSatuPintu/1000).toFixed(2)} m)
                </div>
                <div class="result-item" style="padding-left: 1em; font-size: 1.1em; color: #d32f2f;">
                    &bull; Kelebaran Minima Setiap Tangga: <strong>${lebarSatuTangga.toLocaleString()} mm</strong> (${(lebarSatuTangga/1000).toFixed(2)} m)
                </div>
                <div class="result-item" style="font-size: 0.8em; color: #666; padding-left: 2em;">*Ini memastikan baki laluan keluar masih mampu menampung semua penghuni.</div>
            `;
        });
    });
</script>

</body>
</html>
